name: npm Publish (ffmpeg-static)

# Releases are created by main.yml with the default GITHUB_TOKEN, whose events
# never trigger other workflows (GitHub recursion prevention) — so the release
# trigger below only fires for manually created releases. workflow_run is the
# reliable path: it fires when the CI/CD Pipeline completes on master, and the
# version-check gate keeps it a no-op unless clients/npm was actually bumped.
on:
  release:
    types: [created]
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
  workflow_dispatch:

defaults:
  run:
    working-directory: clients/npm

jobs:
  # The client version is not read from the repository: it is the release that
  # was just published. Keeping it in package.json meant remembering to bump
  # three files by hand for every release, which is exactly what did not happen
  # for v1.0.39 and v1.0.40 — npm sat on 1.0.38, pointing at a fork release from
  # before FFmpeg 9.0, for two months. Deriving it removes the step instead of
  # documenting it.
  check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version-check.outputs.skip }}
      tag: ${{ steps.version-check.outputs.tag }}
      version: ${{ steps.version-check.outputs.version }}
      ffversion: ${{ steps.version-check.outputs.ffversion }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Resolve the release to ship, and whether it is already on npm
        id: version-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The latest full release, whatever triggered this run: a release
          # event, the pipeline finishing on master, or a manual dispatch.
          # `gh release view` without a tag skips prereleases, so an RC never
          # becomes an npm version.
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          VERSION="${TAG#v}"

          # The upstream ffmpeg version is part of every asset filename, so read
          # it from the release rather than carrying a second constant that can
          # drift: ffmpeg-9.0-linux-x86_64-v1.0.40.tar.gz -> 9.0
          FFVERSION=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | sed -n 's/^ffmpeg-\([0-9][0-9.]*\)-.*/\1/p' | head -1)
          if [ -z "$FFVERSION" ]; then
            echo "::error::Could not read the ffmpeg version from ${TAG}'s asset names."
            exit 1
          fi

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PUBLISHED=$(npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null || echo "")

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "ffversion=${FFVERSION}"
          } >> "$GITHUB_OUTPUT"

          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "${PACKAGE_NAME}@${VERSION} is already published — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing ${PACKAGE_NAME}@${VERSION} for fork release ${TAG} (ffmpeg ${FFVERSION})."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Stamp the release onto the package before anything is built or tested,
      # so the tests run against what will actually ship. Nothing is committed:
      # the repository keeps whatever placeholder it has, and the published
      # package is always the release it downloads from.
      - name: Stamp the release onto the client
        env:
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          FFVERSION: ${{ needs.check.outputs.ffversion }}
        run: |
          set -euo pipefail
          sed -i -E "s|(FORK_VERSION = process\.env\['NOMERCY_FFMPEG_VERSION'\] \?\? ')[^']*(')|\1${TAG}\2|" src/version.ts
          sed -i -E "s|(FFMPEG_VERSION = process\.env\['NOMERCY_FFMPEG_FFVERSION'\] \?\? ')[^']*(')|\1${FFVERSION}\2|" src/version.ts
          npm version "${VERSION}" --no-git-tag-version --allow-same-version >/dev/null

          # Fail loudly rather than publish a package that points somewhere else.
          grep -q "?? '${TAG}'" src/version.ts \
            && grep -q "?? '${FFVERSION}'" src/version.ts \
            || { echo "::error::version.ts did not take the stamp"; cat src/version.ts; exit 1; }
          echo "Publishing $(node -p "require('./package.json').version") for ${TAG} (ffmpeg ${FFVERSION})."

      # Do NOT self-upgrade npm here (`npm install -g npm@latest`): overwriting
      # the toolcache npm in place leaves a broken install — `npm publish
      # --provenance` then fails with MODULE_NOT_FOUND for 'sigstore'. The npm
      # bundled with Node 24 already supports trusted publishing + provenance.

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --provenance --access public
