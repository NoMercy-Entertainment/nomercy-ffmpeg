name: Detect Changes

on:
  workflow_call:
    inputs:
      force_rebuild:
        description: 'Force rebuild all components'
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: 'Next version tag (vMAJOR.MINOR.PATCH+1)'
        value: ${{ jobs.detect-changes.outputs.version }}
      base-changed:
        description: 'Base image needs rebuild'
        value: ${{ jobs.detect-changes.outputs.base-changed }}
      platforms-to-build:
        description: 'JSON array of platform names to (re)build, e.g. ["linux-x86_64","windows-x86_64"]'
        value: ${{ jobs.detect-changes.outputs.platforms-to-build }}
      test-matrix:
        description: 'JSON {"include":[…]} for the test job — only entries whose platform is being built'
        value: ${{ jobs.detect-changes.outputs.test-matrix }}
      any-changed:
        description: 'True if base or any platform needs rebuild'
        value: ${{ jobs.detect-changes.outputs.any-changed }}
      all-platforms:
        description: 'Every supported platform, space-separated -- what a complete release must carry'
        value: ${{ jobs.detect-changes.outputs.all-platforms }}
      source-refs:
        description: 'BEATDETECT_TAG=.. KEYDETECT_TAG=.. STEMSPLIT_TAG=.. OMNIDRIVE_REF=.. -- resolved once, passed to every platform build'
        value: ${{ jobs.detect-changes.outputs.source-refs }}

# Single source of truth for the platform list. Anything that needs to know
# about platforms (this workflow, the matrix in main.yml) reads it from here.
env:
  ALL_PLATFORMS: "linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64 darwin-x86_64 darwin-arm64 freebsd-x86_64"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base-changed: ${{ steps.detect.outputs.base-changed }}
      platforms-to-build: ${{ steps.detect.outputs.platforms-to-build }}
      test-matrix: ${{ steps.detect.outputs.test-matrix }}
      any-changed: ${{ steps.detect.outputs.any-changed }}
      all-platforms: ${{ steps.detect.outputs.all-platforms }}
      source-refs: ${{ steps.sources.outputs.source-refs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - name: Compute next version
        id: version
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | sed 's/v//')
          MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
          NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST_TAG} → next: ${NEW_VERSION}"

      # Our own filters and omnidrive are fetched inside init.sh as "the
      # newest". Resolved here once, every platform gets the same source, and
      # the Dockerfile ARGs make a new release rerun init.sh rather than
      # replay the cached download. Fails the run rather than letting a
      # platform fall back to resolving on its own.
      - name: Resolve our own sources
        id: sources
        run: |
          api=https://forgejo.phillippepelzer.me/api/v1/repos/FiLL
          refs=""
          for pair in BEATDETECT_TAG:ffmpeg-beatdetect KEYDETECT_TAG:ffmpeg-keydetect STEMSPLIT_TAG:ffmpeg-stemsplit; do
            var=${pair%%:*}; repo=${pair#*:}
            tag=$(curl -fsSL --retry 3 --max-time 60 "${api}/${repo}/releases/latest" \
              | sed -n 's/.*"tag_name" *: *"\([^"]*\)".*/\1/p')
            if ! [[ $tag =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::could not resolve the newest release of ${repo} (got '${tag}')"
              exit 1
            fi
            echo "${repo}: ${tag}"
            refs="${refs} ${var}=${tag}"
          done
          # omnidrive has no release yet; its default branch commit until it does.
          # The API answers 404 while there is none, so this lookup may fail;
          # `|| true` keeps that from ending the step when pipefail is on.
          ref=$(curl -fsSL --retry 3 --max-time 60 "${api}/omnidrive/releases/latest" 2>/dev/null \
            | sed -n 's/.*"tag_name" *: *"\([^"]*\)".*/\1/p' || true)
          if [ -z "$ref" ]; then
            ref=$(git ls-remote https://forgejo.phillippepelzer.me/FiLL/omnidrive.git HEAD | cut -f1)
          fi
          if ! [[ $ref =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::could not resolve omnidrive (got '${ref}')"
            exit 1
          fi
          echo "omnidrive: ${ref}"
          refs="${refs} OMNIDRIVE_REF=${ref}"
          echo "source-refs=${refs# }" >> "$GITHUB_OUTPUT"

      - name: Detect changed components
        id: detect
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          # ── Per-platform test-runner mapping ──────────────────────────────
          # Single source of truth for "how do we smoke-test platform X":
          #   os    — GitHub-hosted runner image
          #   ext   — archive extension produced by the build
          #   kind  — "unix" or "windows" (selects the test script)
          # macos-15-intel is the supported x86_64 macOS runner (macos-13 was
          # retired 2025-12-04; Intel macOS is supported until ~Fall 2027).
          # macos-latest is arm64. ubuntu-latest is x86_64 — linux-aarch64 can
          # only verify the archive extracts, smoke.sh handles the cross-arch skip.
          # freebsd-x86_64 has no GitHub-hosted runner; like linux-aarch64 it
          # runs on ubuntu-latest where smoke.sh downgrades to a presence check.
          # windows-aarch64 runs on windows-latest, which is x64: it cannot
          # execute an ARM64 PE any more than ubuntu can, so smoke.ps1 does the
          # same cross-exec downgrade and validates the PE header instead.
          declare -A OS=(
            [linux-x86_64]=ubuntu-latest
            [linux-aarch64]=ubuntu-latest
            [windows-x86_64]=windows-latest
            [windows-aarch64]=windows-latest
            [darwin-x86_64]=macos-15-intel
            [darwin-arm64]=macos-latest
            [freebsd-x86_64]=ubuntu-latest
          )
          declare -A EXT=(
            [linux-x86_64]=tar.gz
            [linux-aarch64]=tar.gz
            [windows-x86_64]=zip
            [windows-aarch64]=zip
            [darwin-x86_64]=tar.gz
            [darwin-arm64]=tar.gz
            [freebsd-x86_64]=tar.gz
          )
          declare -A KIND=(
            [linux-x86_64]=unix
            [linux-aarch64]=unix
            [windows-x86_64]=windows
            [windows-aarch64]=windows
            [darwin-x86_64]=unix
            [darwin-arm64]=unix
            [freebsd-x86_64]=unix
          )

          emit_outputs() {
            local platforms_json="$1" base_changed="$2"
            local include_json='[]'
            if [[ "${platforms_json}" != "[]" ]]; then
              local entries=()
              while read -r p; do
                entries+=("$(jq -nc \
                  --arg platform "$p" \
                  --arg os "${OS[$p]}" \
                  --arg ext "${EXT[$p]}" \
                  --arg kind "${KIND[$p]}" \
                  '{platform:$platform, os:$os, ext:$ext, kind:$kind}')")
              done < <(echo "${platforms_json}" | jq -r '.[]')
              include_json=$(printf '%s\n' "${entries[@]}" | jq -sc '.')
            fi
            local test_matrix
            test_matrix=$(jq -nc --argjson include "${include_json}" '{include:$include}')

            local any=false
            [[ "${base_changed}" == "true" || "${platforms_json}" != "[]" ]] && any=true

            {
              echo "base-changed=${base_changed}"
              echo "platforms-to-build=${platforms_json}"
              echo "test-matrix=${test_matrix}"
              echo "any-changed=${any}"
              echo "all-platforms=${ALL_PLATFORMS}"
            } >> "$GITHUB_OUTPUT"

            echo "─── Detection result ────────────────────────────────"
            echo "  base-changed:       ${base_changed}"
            echo "  platforms-to-build: ${platforms_json}"
            echo "  test-matrix:        ${test_matrix}"
            echo "  any-changed:        ${any}"
          }

          # Force-rebuild shortcut: every platform + base rebuilds.
          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            echo "Force rebuild requested — marking everything as changed."
            PLATFORMS_JSON=$(echo "${ALL_PLATFORMS}" | jq -Rc 'split(" ")')
            emit_outputs "${PLATFORMS_JSON}" "true"
            exit 0
          fi

          # Diff the whole push, not just its last commit. This used to compare
          # HEAD^ with HEAD, so a push carrying several commits had only the last
          # one classified: if an earlier commit changed a script, a dockerfile or
          # a workflow and the last did not, nothing was rebuilt. The comment that
          # stood here called an empty diff "the safe default", which it is not
          # for a release pipeline -- it skips a rebuild that was needed.
          #
          # `github.event.before` is the tip before the push. In a reusable
          # workflow the github context belongs to the caller, so it is the push
          # to master. When it is missing or unreachable (all zeros on a new ref,
          # a force push) there is no honest diff to take, so rebuild everything
          # rather than guess. In practice master only takes squash merges, which
          # are single commits, so this mostly guards against that policy changing.
          #
          # Only pushes are affected. A workflow_dispatch with force_rebuild=false
          # is an explicit request not to force, and keeps the old HEAD^ diff.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${PUSH_BEFORE:-}" && ! "${PUSH_BEFORE}" =~ ^0+$ ]] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              CHANGED_FILES=$(git diff --name-only "${PUSH_BEFORE}" HEAD)
              echo "Diffing the whole push: ${PUSH_BEFORE:0:12}..HEAD"
            else
              echo "No usable push base (${PUSH_BEFORE:-<none>}) -- rebuilding everything rather than guessing."
              PLATFORMS_JSON=$(echo "${ALL_PLATFORMS}" | jq -Rc 'split(" ")')
              emit_outputs "${PLATFORMS_JSON}" "true"
              exit 0
            fi
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          fi
          echo "Changed files:"
          echo "${CHANGED_FILES:-(none)}"

          # ── Classify changed paths ─────────────────────────────────────────
          # Shared inputs affect every platform's build:
          #   scripts/*.sh, scripts/{init,patches,resources}/*,
          #   scripts/includes/<non-platform-file> (e.g. raw .c sources),
          #   dev/init/*
          # Workflow changes affect everything by definition.
          # Platform-specific scripts only affect their own platform:
          #   {scripts,dev}/includes/<platform>/*  where <platform> ∈
          #   {linux, darwin, windows}.  (linux script change rebuilds both
          #   linux-x86_64 and linux-aarch64; darwin rebuilds both darwin
          #   variants; windows rebuilds windows-x86_64.)
          matches() { echo "${CHANGED_FILES}" | grep -qE "$1"; }

          SHARED=false
          matches "^scripts/(init|patches|resources)/" && SHARED=true
          matches "^scripts/[^/]+\.sh$"                && SHARED=true
          matches "^(scripts|dev)/includes/[^/]+$"     && SHARED=true
          matches "^dev/init/"                         && SHARED=true

          # A change confined to workflows that cannot affect the binaries must
          # not trigger a rebuild. Before this, anything under .github/workflows/
          # except npm-publish.yml rebuilt all seven platforms, so every CI fix
          # forced a release whose archives were byte-identical to the previous
          # one -- v1.0.44 was exactly that.
          #
          # Only three workflows decide what ends up in an archive: this one,
          # main.yml and reusable-docker-build.yml. The rest gate pull requests,
          # report fleet health, verify or retract an existing release, or tidy
          # up after one. None of them can change a binary.
          #
          # Deliberately a denylist, not an allowlist: a workflow added later
          # falls through to WORKFLOW=true and rebuilds. Rebuilding when it was
          # not needed costs an hour; not rebuilding when it was needed ships
          # stale binaries, so the unknown case has to be the conservative one.
          NON_BUILD_WORKFLOWS='^\.github/workflows/(delete-workflow-runs|fleet-health|mac-runner-check|npm-publish|pr-guards|retract-release|verify-rc|verify-windows-arm64-emulated)\.yml$'
          WORKFLOW=false
          if echo "${CHANGED_FILES}" \
               | grep -E "^\.github/workflows/" \
               | grep -qvE "${NON_BUILD_WORKFLOWS}"; then
            WORKFLOW=true
          fi

          LINUX_SCRIPTS=false;   matches "^(scripts|dev)/includes/linux/"   && LINUX_SCRIPTS=true
          DARWIN_SCRIPTS=false;  matches "^(scripts|dev)/includes/darwin/"  && DARWIN_SCRIPTS=true
          WINDOWS_SCRIPTS=false; matches "^(scripts|dev)/includes/windows/" && WINDOWS_SCRIPTS=true
          FREEBSD_SCRIPTS=false; matches "^(scripts|dev)/includes/freebsd/" && FREEBSD_SCRIPTS=true

          # Base image rebuilds on its own Dockerfile or shared script changes.
          BASE_CHANGED=false
          matches "ffmpeg-base\.dockerfile" && BASE_CHANGED=true
          [[ "${SHARED}" == "true" ]] && BASE_CHANGED=true

          # A workflow-file change conservatively rebuilds everything so that
          # any new build flag or environment tweak actually applies.
          if [[ "${WORKFLOW}" == "true" ]]; then
            BASE_CHANGED=true
          fi

          # Per-platform decision:
          #   rebuild if base rebuilds, or its own Dockerfile changed,
          #   or its platform-family scripts changed, or workflow changed.
          platform_changed() {
            local platform="$1" platform_scripts_var="$2"
            local dockerfile="ffmpeg-${platform}.dockerfile"
            local scripts_changed="${!platform_scripts_var}"

            [[ "${BASE_CHANGED}" == "true" ]]      && { echo true; return; }
            [[ "${WORKFLOW}" == "true" ]]          && { echo true; return; }
            [[ "${scripts_changed}" == "true" ]]   && { echo true; return; }
            matches "${dockerfile}"                && { echo true; return; }
            echo false
          }

          echo "─── State before platform loop ──────────────────────"
          echo "  ALL_PLATFORMS:    [${ALL_PLATFORMS}]"
          echo "  BASE_CHANGED:     ${BASE_CHANGED}"
          echo "  WORKFLOW:         ${WORKFLOW}"
          echo "  LINUX_SCRIPTS:    ${LINUX_SCRIPTS}"
          echo "  DARWIN_SCRIPTS:   ${DARWIN_SCRIPTS}"
          echo "  WINDOWS_SCRIPTS:  ${WINDOWS_SCRIPTS}"
          echo "  FREEBSD_SCRIPTS:  ${FREEBSD_SCRIPTS}"

          PLATFORMS=()

          # Fast path: when base rebuilds (incl. workflow changes), every
          # platform must rebuild — they all FROM the base. Skip the
          # per-platform classification entirely. This also dodges any
          # weirdness in the per-iteration loop logic.
          if [[ "${BASE_CHANGED}" == "true" ]]; then
            echo "  → BASE_CHANGED=true: including all platforms"
            for p in ${ALL_PLATFORMS}; do
              PLATFORMS+=("${p}")
            done
          else
            for p in ${ALL_PLATFORMS}; do
              case "${p}" in
                linux-*)   var=LINUX_SCRIPTS   ;;
                darwin-*)  var=DARWIN_SCRIPTS  ;;
                windows-*) var=WINDOWS_SCRIPTS ;;
                freebsd-*) var=FREEBSD_SCRIPTS ;;
                *)         var=""              ;;
              esac
              result="$(platform_changed "${p}" "${var}")"
              echo "  loop[${p}]: var=${var} → result=${result}"
              if [[ "${result}" == "true" ]]; then
                PLATFORMS+=("${p}")
              fi
            done
          fi

          echo "  PLATFORMS array: (${#PLATFORMS[@]}) ${PLATFORMS[*]}"

          # All or nothing. A release has to carry every platform: the npm client
          # pins itself to the newest tag and builds every asset URL from it, so
          # a release holding only the linux archives hands a 404 to everyone
          # else. This loop used to narrow a master push to the platforms whose
          # inputs changed -- a change under scripts/includes/linux/ built two
          # platforms and published a two-platform release.
          #
          # Narrowing had no other use left. Pull requests already force a full
          # build and dispatch takes its own input, so a master push was the ONLY
          # caller it affected, and there it was harmful. So: if anything needs
          # building, build everything. Unchanged platforms rebuild to identical
          # archives -- v1.0.44 against v1.0.43 was byte-for-byte equal on all
          # seven -- so this costs time, never correctness. An empty set stays
          # empty, which keeps a non-build workflow change from cutting a release.
          set -- ${ALL_PLATFORMS}
          ALL_COUNT=$#
          if [[ ${#PLATFORMS[@]} -gt 0 && ${#PLATFORMS[@]} -lt ${ALL_COUNT} ]]; then
            echo "  -> ${#PLATFORMS[@]} of ${ALL_COUNT} platforms changed; widening to all ${ALL_COUNT} so the release stays complete"
            PLATFORMS=()
            for p in ${ALL_PLATFORMS}; do
              PLATFORMS+=("${p}")
            done
          fi

          # Emit JSON array — directly usable as matrix input via fromJSON().
          # -n is critical: without it, jq consumes the first stdin line as
          # its main filter input, and `inputs` reads from the SECOND line
          # onwards — silently dropping element 0. With -n, jq starts with
          # null input and `inputs` reads everything.
          if [[ ${#PLATFORMS[@]} -eq 0 ]]; then
            PLATFORMS_JSON="[]"
          else
            PLATFORMS_JSON=$(printf '%s\n' "${PLATFORMS[@]}" | jq -Rcn '[inputs]')
          fi

          emit_outputs "${PLATFORMS_JSON}" "${BASE_CHANGED}"
