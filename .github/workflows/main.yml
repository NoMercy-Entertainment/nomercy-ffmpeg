name: CI/CD Pipeline

# Single source of truth for the FFmpeg version produced by this build.
# Must track `ffmpeg_version` in ffmpeg-base.dockerfile — bump both together.
env:
  FFMPEG_VERSION: "9.0"

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild of all images'
        required: true
        type: boolean
        default: true

jobs:
  # ── Detect which platforms need to (re)build ─────────────────────────────
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      # A PR builds all platforms (it becomes the RC). Pushes to master keep
      # normal diff-based detection. workflow_dispatch honours its input.
      force_rebuild: ${{ inputs.force_rebuild || github.event_name == 'pull_request' }}

  # ── Base image (every platform FROMs this) ───────────────────────────────
  # This repository is public and this workflow runs on pull_request, so the
  # three jobs below would otherwise be reachable from a fork. GitHub withholds
  # secrets from fork PRs, but not the runner: an approved fork PR executes its
  # own code on our hardware. The approval gate is a setting someone can relax
  # or misclick, so the jobs that touch self-hosted machines say so themselves.
  # Everything else is unchanged - push, workflow_dispatch and same-repo PRs,
  # which is what the RC flow uses.
  build-base:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.base-changed == 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      dockerfile: ffmpeg-base.dockerfile
      platform: base
      secrets_repo: false
      depends_on_base: false
      labels: beast-unit
      no_cache: ${{ inputs.force_rebuild || false }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  # ── Platform builds (matrix from detect-changes) ─────────────────────────
  # Skipped (zero matrix entries) when detect-changes returns "[]".
  # always()+!cancelled() lets platforms run even when build-base was
  # skipped (then we rely on the existing :latest base on the registry).
  build-platforms:
    needs: [detect-changes, build-base]
    if: |
      always() && !cancelled()
      && needs.detect-changes.outputs.platforms-to-build != '[]'
      && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.detect-changes.outputs.platforms-to-build) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      dockerfile: ffmpeg-${{ matrix.platform }}.dockerfile
      platform: ${{ matrix.platform }}
      secrets_repo: true
      labels: beast-unit
      no_cache: ${{ inputs.force_rebuild || false }}
      # Pin every matrix build to the exact base produced this run. When the
      # base was rebuilt (PRs, force_rebuild, or base-changed on master) it was
      # pushed tagged with this commit SHA, so we FROM that immutable tag;
      # otherwise fall back to the existing registry :latest. Combined with
      # --pull in the reusable build, this guarantees the matrix never compiles
      # against a stale local base image on a beast-unit runner.
      base_tag: ${{ needs.detect-changes.outputs.base-changed == 'true' && github.sha || 'latest' }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      PAT_TOKEN: ${{ secrets.PAT }}

  # ── Export the produced binaries straight from the built images ────────
  # Runs on a beast-unit self-hosted runner. When the same runner did the
  # build, the image is local and `docker create` is instant; when it ran
  # elsewhere, `docker create` auto-pulls — `docker login` covers the
  # private-registry case.
  #
  # `Linux` and `X64` are part of the constraint on purpose, not decoration.
  # The `beast-unit` label also sits on the Windows and macOS runners, so
  # `[self-hosted, beast-unit]` alone lets this job land on either of them —
  # where it cannot work: the steps below use `docker/login-action`,
  # `set -euo pipefail` and `declare -A`, and Windows defaults to PowerShell
  # while macOS ships bash 3.2 with no associative arrays. Reported as #74
  # after the same scheduling hazard broke a deploy in another repository.
  # `Linux` and `X64` are assigned automatically by the runner software, so
  # they are a safer constraint here than this repo's own `linux-x86_64`
  # label, which belongs to the separate `ffmpeg-verify` pool.
  export-artifacts:
    needs: [detect-changes, build-platforms]
    if: |
      always() && !cancelled()
      && needs.build-platforms.result == 'success'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Export artifacts from images
        run: |
          set -euo pipefail
          mkdir -p downloads

          declare -A EXT=(
            [linux-x86_64]=tar.gz
            [linux-aarch64]=tar.gz
            [windows-x86_64]=zip
            [windows-aarch64]=zip
            [darwin-x86_64]=tar.gz
            [darwin-arm64]=tar.gz
            [freebsd-x86_64]=tar.gz
          )

          # platforms-to-build is a JSON array; jq into a bash array.
          mapfile -t PLATFORMS < <(echo '${{ needs.detect-changes.outputs.platforms-to-build }}' | jq -r '.[]')

          for p in "${PLATFORMS[@]}"; do
            ext="${EXT[$p]:-tar.gz}"
            archive="ffmpeg-${FFMPEG_VERSION}-${p}.${ext}"
            image="nomercyentertainment/ffmpeg-${p}:${{ github.sha }}"

            echo "🚚 Exporting ${p} from ${image}"
            # docker create auto-pulls when the image isn't local.
            cid=$(docker create "${image}")
            docker cp "${cid}:/build/${archive}" "downloads/${archive}"
            docker rm -f "${cid}" >/dev/null
            ls -lh "downloads/${archive}"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: downloads/
          retention-days: 30
          if-no-files-found: error

  # ── Minimal smoke gate: binary runs, reports the expected version, exits 0 ──
  # The full codec/hardware suite (tests/tests.sh, tests/tests.ps1) is run
  # MANUALLY by a contributor on real hardware against the RC prerelease.
  smoke-test:
    needs: [detect-changes, export-artifacts]
    if: |
      always() && !cancelled()
      && needs.export-artifacts.result == 'success'
      && needs.detect-changes.outputs.platforms-to-build != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.test-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: downloads/

      - name: Unpack binary
        shell: bash
        run: |
          archive="downloads/ffmpeg-${FFMPEG_VERSION}-${{ matrix.platform }}.${{ matrix.ext }}"
          if [[ ! -f "${archive}" ]]; then
            echo "❌ Expected artifact missing: ${archive}"
            ls -la downloads/ || true
            exit 1
          fi
          case "${{ matrix.ext }}" in
            tar.gz) tar -xzf "${archive}" ;;
            zip)    unzip -o "${archive}" ;;
          esac

      - name: Smoke test (unix)
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          chmod +x tests/smoke.sh
          tests/smoke.sh "${GITHUB_WORKSPACE}" "${FFMPEG_VERSION}" "${{ matrix.platform }}"

      - name: Smoke test (windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./tests/smoke.ps1 -Workspace $env:GITHUB_WORKSPACE -ExpectedVersion $env:FFMPEG_VERSION -Platform "${{ matrix.platform }}"

  # ── Metal release gates, on real Apple Silicon ──────────────────────────
  # The only job in this pipeline that can answer whether Metal actually
  # WORKS. Every other Metal check is static: the backend is linked, the
  # embedded shader blob is the right size, the metadata string is present.
  # None of that executes a line of Metal — the shaders ship as *source* that
  # the user's machine compiles at run time, so "it built" says nothing about
  # "it runs", and that compile could fail on the first real device.
  #
  # Four labels on runs-on, on purpose. The fleet also holds an Intel Mac and
  # the Linux beast-unit, and #74 was exactly this mistake: a runs-on with one
  # unqualified label matched eight jobs onto whatever machine happened to
  # carry it, and put a linux-x86_64 docker build on a macOS runner. `macOS`
  # alone would reach the Intel Mac, where Metal is deliberately OFF and an
  # arm64 binary cannot even start.
  #
  # Deliberately NOT in any other job's `needs`. It reports; it does not gate
  # the release. Whether a red Metal gate should block a release is the
  # owner's call, not something to smuggle in with the job that first measures
  # it.
  metal-gates:
    needs: [detect-changes, export-artifacts]
    if: |
      always() && !cancelled()
      && needs.export-artifacts.result == 'success'
      && contains(needs.detect-changes.outputs.platforms-to-build, 'darwin-arm64')
    runs-on: [self-hosted, macOS, ARM64, apple-silicon]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: downloads/

      - name: Unpack the darwin-arm64 binary
        shell: bash
        run: |
          archive="downloads/ffmpeg-${FFMPEG_VERSION}-darwin-arm64.tar.gz"
          if [[ ! -f "${archive}" ]]; then
            echo "::error::expected artifact missing: ${archive}"
            ls -la downloads/ || true
            exit 1
          fi
          tar -xzf "${archive}"
          chmod +x ./ffmpeg
          # Refuse to test the wrong thing. This runner keeps state between
          # jobs, and an ffmpeg left over from an earlier run would answer
          # every gate below while proving nothing about this build.
          if ! file ./ffmpeg | grep -q 'arm64'; then
            echo "::error::unpacked ffmpeg is not arm64: $(file ./ffmpeg)"
            exit 1
          fi

      - name: Prepare test assets
        shell: bash
        run: |
          set -uo pipefail
          # The models are large and unchanging, so on this persistent runner
          # they live outside the workspace and are fetched once. The
          # workspace itself is wiped by the cleanup step at the end.
          CACHE="${HOME}/nm-ci-assets"
          mkdir -p "${CACHE}"

          # Pinned by digest. Downloading a model and not checking what came
          # back is how a green run ends up measuring something else.
          fetch() {  # fetch <url> <name> <sha256>
            local url="$1" out="${CACHE}/$2" want="$3" got
            if [ -f "${out}" ]; then
              got="$(shasum -a 256 "${out}" | cut -d' ' -f1)"
              if [ "${got}" = "${want}" ]; then echo "cached:  $2"; return 0; fi
              echo "::warning::cached $2 has digest ${got}, expected ${want} — refetching"
            fi
            curl -fsSL --retry 3 -o "${out}.part" "${url}" || {
              echo "::error::download failed: ${url}"; return 1; }
            got="$(shasum -a 256 "${out}.part" | cut -d' ' -f1)"
            if [ "${got}" != "${want}" ]; then
              echo "::error::$2: expected ${want}, got ${got}"
              rm -f "${out}.part"; return 1
            fi
            mv "${out}.part" "${out}"
            echo "fetched: $2"
          }

          fetch "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin" \
                "ggml-base.en.bin" \
                "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002" || exit 1
          fetch "https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.1/samples/jfk.wav" \
                "jfk.wav" \
                "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e" || exit 1

          # The stemsplit model, fetched by digest like the two above. It is
          # not in this repository's releases: it lives in the org's
          # nomercy-stemsplit-models, which is public, so no token is needed.
          #
          # This used to demand the file be placed on the runner by hand, on
          # the belief that the model was attached to no release. It was:
          # v2026.09.09 has carried it since 2026-09-09, with a matching
          # sha256. Nobody put it on the Mac mini, so this job failed on every
          # run, and because a failed job makes the whole workflow conclude
          # failure, npm-publish's conclusion gate skipped. That is why npm sat
          # on 1.0.42 while v1.0.43 and v1.0.44 shipped: a reporting job in no
          # other job's needs was silently blocking the client release.
          fetch "https://github.com/NoMercy-Entertainment/nomercy-stemsplit-models/releases/download/v2026.09.09/spleeter-2stems-f16.gguf" \
                "spleeter-2stems-f16.gguf" \
                "155dc9d2e2eef70ad633af98134df29a5273defaeb98ef013d46251faa69d0ad" || exit 1

          # A music clip generated by the binary under test rather than
          # downloaded: no licensing question, identical every run, and gate 4
          # only needs *some* audio to compare CPU against Metal on. ~40 s
          # because the gate script wants at least ~35 s.
          ./ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=220:duration=40" \
            -f lavfi -i "anoisesrc=duration=40:color=pink:amplitude=0.1" \
            -filter_complex "[0][1]amix=inputs=2,aformat=sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo" \
            -c:a libmp3lame -b:a 192k "${CACHE}/input.mp3"

          for a in ggml-base.en.bin jfk.wav spleeter-2stems-f16.gguf input.mp3; do
            cp "${CACHE}/${a}" "./${a}"
          done
          ls -la ggml-base.en.bin jfk.wav spleeter-2stems-f16.gguf input.mp3

      - name: Run the four Metal gates
        shell: bash
        run: |
          chmod +x tools/metal/verify-on-mac.sh
          # tee, so the summary step can quote the script's real output
          # instead of a retyped version of it.
          set -o pipefail
          tools/metal/verify-on-mac.sh "${GITHUB_WORKSPACE}" ffmpeg 2>&1 | tee metal-gates.log

      - name: Publish the gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Metal release gates — darwin-arm64 on Apple Silicon"
            echo
            echo "Runner: $(sysctl -n hw.model 2>/dev/null || echo unknown) / $(uname -m) / macOS $(sw_vers -productVersion 2>/dev/null || echo '?')"
            echo
            if [ -f metal-gates.log ]; then
              echo '```'
              # The script ends with a copy-pasteable block meant for issue #69.
              sed -n '/=== METAL RELEASE GATES/,/=== END SUMMARY ===/p' metal-gates.log
              echo '```'
            else
              echo "The gate script produced no log — it failed before writing one."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the full gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metal-gates-log
          path: metal-gates.log
          if-no-files-found: warn

      - name: Clean the workspace
        if: always()
        shell: bash
        run: |
          # This runner is persistent and these files are large. The cached
          # models under ~/nm-ci-assets are deliberately kept; everything this
          # job copied into the workspace is not.
          rm -f ./ffmpeg ./ffprobe ./ffplay ./*.jar \
                ./ggml-base.en.bin ./jfk.wav ./spleeter-2stems-f16.gguf ./input.mp3 \
                ./metal-gates.log
          rm -rf ./downloads
          df -h . | tail -1

  # ── Publish/refresh the Release Candidate prerelease (release PR only) ───
  # Gives contributors version-stamped binaries to test manually on each
  # platform. Deleted+recreated each run so assets and tag always match the
  # latest release-PR head. Promoted to a real release on master merge (see
  # release).
  #
  # Restricted to the dev->master PR. This job deletes and recreates one shared
  # tag, so without a branch condition the RC belongs to whichever PR into
  # master finished last. That is not theoretical: a workflow-only PR branched
  # from master republished v1.0.39-rc over the one dev had published, and for
  # fourteen hours the advertised release candidate contained none of the
  # twenty commits it was supposed to be shipping. Nothing caught it, because
  # the manual suite proves libraries were compiled in rather than that the new
  # features work, so it passed on the wrong binaries. pr-guards already says
  # PRs into master come from dev; this says it where the damage happens.
  #
  # head_ref is a bare branch name, so the same-repo check is not redundant: a
  # fork's branch called `dev` satisfies the first condition. It cannot reach
  # this job today only because export-artifacts is fork-guarded, and inheriting
  # a guarantee from another job's condition is the kind of coincidence that
  # stops being true the moment that job is refactored.
  publish-rc:
    needs: [detect-changes, export-artifacts, smoke-test]
    if: |
      github.event_name == 'pull_request'
      && github.head_ref == 'dev'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.export-artifacts.result == 'success'
      && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: downloads/

      - name: Stage RC files with version-stamped names
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${{ needs.detect-changes.outputs.version }}"
          for f in "downloads/ffmpeg-${FFMPEG_VERSION}-"*; do
            [[ -f "$f" ]] || continue
            base=$(basename "$f")
            case "$base" in
              *.tar.gz) stem="${base%.tar.gz}"; ext="tar.gz" ;;
              *)        stem="${base%.*}";     ext="${base##*.}" ;;
            esac
            cp "$f" "release/${stem}-${VERSION}-rc.${ext}"
          done
          ls -lh release/

          # Refuse to publish an incomplete release. The npm client pins itself
          # to the newest tag and builds every platform's asset URL from it, so
          # a release missing one platform is a 404 for everyone on that
          # platform. detect-changes now widens any partial selection to every
          # platform, which is what prevents this; this check is the second
          # line, so that a future change to that selection cannot quietly
          # bring partial releases back. It runs before anything is tagged.
          missing=""
          for platform in ${{ needs.detect-changes.outputs.all-platforms }}; do
            n=$(find release/ -maxdepth 1 -name "ffmpeg-${FFMPEG_VERSION}-${platform}-${VERSION}.*" ! -name "*.sha256" | wc -l)
            if [[ "${n}" -ne 1 ]]; then
              missing="${missing} ${platform}(${n})"
            fi
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::refusing to publish ${VERSION}: expected exactly one archive per platform, got:${missing}"
            exit 1
          fi
          echo "All platforms present: ${{ needs.detect-changes.outputs.all-platforms }}"

      - name: Generate per-asset SHA256, manifest and signature
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ needs.detect-changes.outputs.version }}-rc"

          # Per-asset .sha256 sidecar files
          for f in release/*; do
            [[ -f "$f" ]] || continue
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

          # Build manifest.json (exclude .sha256 sidecars from the assets list)
          assets_json='[]'
          while IFS= read -r fname; do
            [[ "$fname" == *.sha256 ]] && continue
            fp="release/${fname}"
            hash=$(sha256sum "$fp" | awk '{print $1}')
            size=$(stat -c%s "$fp")
            assets_json=$(printf '%s' "$assets_json" | jq \
              --arg name "$fname" --arg sha256 "$hash" --argjson size "$size" \
              '. + [{"name":$name,"sha256":$sha256,"size":$size}]')
          done < <(ls release/ | sort)
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_TAG" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson assets "$assets_json" \
            '{"repo":$repo,"tag":$tag,"version":$version,"commit_sha":$commit_sha,"created_at":$created_at,"build_timestamp":$created_at,"assets":$assets}' \
            > release/manifest.json

          # Import GPG key and create detached ASCII-armored signature.
          # Signing is skipped (with a warning) when the org secret is absent —
          # the media server treats manifest.json.sig as optional.
          if [[ -z "${GPG_SIGNING_KEY:-}" ]]; then
            echo "::warning::GPG_SIGNING_KEY secret not set — manifest.json will not be signed"
          else
            echo "$GPG_SIGNING_KEY" | gpg --batch --import
            if [[ -n "${GPG_SIGNING_KEY_PASSPHRASE:-}" ]]; then
              echo "$GPG_SIGNING_KEY_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
                --passphrase-fd 0 --armor --detach-sign \
                --output release/manifest.json.sig release/manifest.json
            else
              gpg --batch --armor --detach-sign \
                --output release/manifest.json.sig release/manifest.json
            fi
          fi
          ls -lh release/

      - name: Remove previous RC for a clean refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ needs.detect-changes.outputs.version }}-rc" \
            --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes 2>/dev/null || true

      - name: Publish RC prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect-changes.outputs.version }}-rc
          name: Release Candidate ${{ needs.detect-changes.outputs.version }}-rc
          target_commitish: ${{ github.event.pull_request.head.sha }}
          draft: false
          prerelease: true
          files: release/*
          body: |
            # FFmpeg ${{ needs.detect-changes.outputs.version }} — Release Candidate

            **Not for production.** Built from PR #${{ github.event.pull_request.number }}
            (branch `${{ github.head_ref }}`).

            Download the binary for each platform and run the manual suite
            (`tests/tests.sh` / `tests/tests.ps1`) on real hardware, then tick the
            matching box in the PR checklist. All boxes must be checked before merge.

            **Integrity verification:** Each archive ships with a `.sha256` sidecar.
            `manifest.json` lists all assets with SHA-256 digests; `manifest.json.sig`
            is a detached ASCII-armored GPG signature over `manifest.json`.

  # ── Single required status context for the PR build path ─────────────────
  # always() so it always reports; explicit result checks so any failed
  # dependency reliably fails the gate. PR-only (skipped on master pushes).
  pr-build:
    needs: [detect-changes, build-base, build-platforms, export-artifacts, smoke-test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the PR build path is green
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          base='${{ needs.build-base.result }}'
          platforms='${{ needs.build-platforms.result }}'
          export='${{ needs.export-artifacts.result }}'
          smoke='${{ needs.smoke-test.result }}'
          echo "base=$base platforms=$platforms export=$export smoke=$smoke"

          # A fork PR skips the three self-hosted jobs by design, so every check
          # below would report 'skipped' and read as a broken build. Say what
          # actually happened instead. This still fails: the PR genuinely was
          # not built, and a green required check on an unbuilt PR would be a
          # worse lie than a confusing red one.
          if [[ -n "$HEAD_REPO" && "$HEAD_REPO" != "${GITHUB_REPOSITORY}" ]]; then
            echo "❌ Not built: pull requests from forks are not run on this"
            echo "   repository's self-hosted hardware (head repo: ${HEAD_REPO})."
            echo "   A maintainer has to push the branch to ${GITHUB_REPOSITORY}"
            echo "   to get a build."
            exit 1
          fi

          # On a PR we force a full build, so build-base must succeed.
          if [[ "$base" != "success" ]]; then echo "❌ build-base: $base"; exit 1; fi
          if [[ "$platforms" != "success" ]]; then echo "❌ build-platforms: $platforms"; exit 1; fi
          if [[ "$export" != "success" ]]; then echo "❌ export-artifacts: $export"; exit 1; fi
          if [[ "$smoke" != "success" ]]; then echo "❌ smoke-test: $smoke"; exit 1; fi
          echo "✅ PR build path passed."

  # ── Vulnerability scan the freshly-built images ─────────────────────────
  # Master-only — running Trivy on every PR adds 5-10 min for no marginal
  # benefit; vulns appear when a base image is rebuilt, which only happens
  # on master.
  security-scan:
    needs: [detect-changes, build-platforms]
    if: |
      always() && !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.build-platforms.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.detect-changes.outputs.platforms-to-build) }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Pinned to a commit, not @master: this step runs after the login above
      # has written the DockerHub push credentials to the runner's docker
      # config, so whatever code it runs can read them. A branch reference ran
      # whatever that branch held that day (audit AUD-9100). Bump by changing
      # the SHA and the version comment together.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nomercyentertainment/ffmpeg-${{ matrix.platform }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.platform }}.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.platform }}.sarif
          category: trivy-${{ matrix.platform }}

  # ── GitHub release ──────────────────────────────────────────────────────
  # Master push only, after the whole pipeline is green. Uses the version
  # computed once by detect-changes.
  release:
    needs: [detect-changes, export-artifacts, smoke-test]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.export-artifacts.result == 'success'
      && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: downloads/

      - name: Stage release files with version-stamped names
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${{ needs.detect-changes.outputs.version }}"
          for f in "downloads/ffmpeg-${FFMPEG_VERSION}-"*; do
            [[ -f "$f" ]] || continue
            base=$(basename "$f")
            # ffmpeg-9.0-linux-x86_64.tar.gz  →  ffmpeg-9.0-linux-x86_64-vX.Y.Z.tar.gz
            stem="${base%.*}"
            # handle .tar.gz two-part extension
            case "$base" in
              *.tar.gz) stem="${base%.tar.gz}"; ext="tar.gz" ;;
              *)        stem="${base%.*}";     ext="${base##*.}" ;;
            esac
            cp "$f" "release/${stem}-${VERSION}.${ext}"
          done
          ls -lh release/

      - name: Generate per-asset SHA256, manifest and signature
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ needs.detect-changes.outputs.version }}"

          # Per-asset .sha256 sidecar files
          for f in release/*; do
            [[ -f "$f" ]] || continue
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

          # Build manifest.json (exclude .sha256 sidecars from the assets list)
          assets_json='[]'
          while IFS= read -r fname; do
            [[ "$fname" == *.sha256 ]] && continue
            fp="release/${fname}"
            hash=$(sha256sum "$fp" | awk '{print $1}')
            size=$(stat -c%s "$fp")
            assets_json=$(printf '%s' "$assets_json" | jq \
              --arg name "$fname" --arg sha256 "$hash" --argjson size "$size" \
              '. + [{"name":$name,"sha256":$sha256,"size":$size}]')
          done < <(ls release/ | sort)
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_TAG" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson assets "$assets_json" \
            '{"repo":$repo,"tag":$tag,"version":$version,"commit_sha":$commit_sha,"created_at":$created_at,"build_timestamp":$created_at,"assets":$assets}' \
            > release/manifest.json

          # Import GPG key and create detached ASCII-armored signature.
          # Signing is skipped (with a warning) when the org secret is absent —
          # the media server treats manifest.json.sig as optional.
          if [[ -z "${GPG_SIGNING_KEY:-}" ]]; then
            echo "::warning::GPG_SIGNING_KEY secret not set — manifest.json will not be signed"
          else
            echo "$GPG_SIGNING_KEY" | gpg --batch --import
            if [[ -n "${GPG_SIGNING_KEY_PASSPHRASE:-}" ]]; then
              echo "$GPG_SIGNING_KEY_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
                --passphrase-fd 0 --armor --detach-sign \
                --output release/manifest.json.sig release/manifest.json
            else
              gpg --batch --armor --detach-sign \
                --output release/manifest.json.sig release/manifest.json
            fi
          fi
          ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect-changes.outputs.version }}
          name: FFmpeg Build ${{ needs.detect-changes.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
          body: |
            # FFmpeg Cross-Platform Build ${{ needs.detect-changes.outputs.version }}

            **Internal Build for NoMercy MediaServer**

            Cross-platform FFmpeg ${{ env.FFMPEG_VERSION }} binaries.

            ## Platforms
            - Linux x86_64 / aarch64
            - Windows x86_64
            - macOS x86_64 / arm64 (Apple Silicon)
            - FreeBSD x86_64

            ## Integrity Verification
            Each archive ships with a `.sha256` sidecar containing the hex digest.
            `manifest.json` lists every asset with its SHA-256 hash and byte size.
            `manifest.json.sig` is a detached ASCII-armored GPG signature over
            `manifest.json`, signed with the NoMercy Entertainment org key.

            All images scanned with Trivy; results in the Security tab.

            ---
            Built by [NoMercy Entertainment](https://nomercy.tv)

      - name: Delete the promoted RC prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ needs.detect-changes.outputs.version }}-rc" \
            --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes 2>/dev/null || true
          echo "🧹 Removed RC ${{ needs.detect-changes.outputs.version }}-rc (promoted to final)."
